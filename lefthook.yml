# The hooks run the lefthook pinned in package.json, with mise's pinned node and pnpm, whatever lefthook is first on
# PATH; the jobs call the tools mise.toml pins (`mise install`).
lefthook: mise exec -- pnpm exec lefthook

pre-commit:
  skip:
    - merge
    - rebase
  parallel: true
  jobs:
    # Lints only the packages the staged change can affect; see scripts/lint-affected.sh.
    - name: lint
      run: bash scripts/lint-affected.sh
    # Checks the staged files' formatting; CI checks the whole tree (pnpm run pretty).
    - name: pretty
      glob: '*.{ts,tsx,js,jsx,json,css}'
      run: npx prettier --list-different {staged_files}
    # Blocks commits that stage secrets; CI scans the whole history (security.yml).
    - name: secrets
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose
    # The workflow checks CI runs through the shared gha.yml.
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: mise exec -- actionlint {staged_files}
    - name: ghalint
      glob: '.github/workflows/*.{yml,yaml}'
      run: mise exec -- ghalint run

pre-push:
  skip:
    - merge
    - rebase
  jobs:
    # Runs only the suites the branch can affect, and skips a clean tree that already passed them; see
    # scripts/test-affected.sh.
    - name: test
      run: TEST_AFFECTED_SKIP_PASSED=1 bash scripts/test-affected.sh
