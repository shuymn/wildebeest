name: CI
on:
  push:
    branches:
      - main
  pull_request:

# This allows a subsequently queued workflow run to interrupt previous runs. A main run interrupted this way leaves
# nothing unchecked: the next one compares with the last main run that passed (the changes job).
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Decides which suites a change can affect, so a change that is all Kopje Markdown runs only the Node suite. A
  # pull request is compared with its base. A push to main is compared with the commit of the last main run that
  # passed, so what a failed or cancelled run did not check is checked by the next one; when there is no such run,
  # or its commit cannot be fetched, everything runs.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last main run that passed
    outputs:
      kopje: ${{ steps.suites.outputs.kopje }}
      kopje_code: ${{ steps.suites.outputs.kopje_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # A pull request is checked out as a merge commit whose first parent is the base branch. The tree of the last
        # main run that passed was checked in full, through the runs before it, so a main push needs only the paths
        # that differ from it.
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          if [[ "$passed" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 origin "$passed"; then
            echo "compared with $passed, the last main run that passed"
            git diff --no-renames --name-only "$passed" HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
          else
            printf 'kopje=true\nkopje_code=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    # The slowest shard has taken up to 10.3 minutes on a hosted runner.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node and pnpm at the versions mise.lock pins; the hooks' tools are not needed here.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm

      - name: Install
        run: pnpm install

      - name: Run API tests
        env:
          KOPJE: ${{ needs.changes.outputs.kopje }}
          KOPJE_CODE: ${{ needs.changes.outputs.kopje_code }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash scripts/test-affected.sh --shard "$SHARD"

  # The code suites again, collecting V8 coverage of Kopje's src/ and cli/ (vitest.config.ts) for the coverage job, in
  # shards of their own: V8's block counters slow a tight JavaScript loop many times over (a string's JSON bytes, char
  # by char, about 30 times), which would push a required shard's test past its timeout. The default test timeout is
  # raised here; a test with its own timeout can still fail, and its shard still reports what it covered. Like the
  # coverage job, neither required nor able to fail the run, and only for main and pull requests from this repository.
  coverage-test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.kopje_code == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node and pnpm at the versions mise.lock pins; the hooks' tools are not needed here.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm

      - name: Install
        run: pnpm install

      - name: Run API tests with coverage
        env:
          KOPJE: "true"
          KOPJE_CODE: "true"
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash scripts/test-affected.sh --shard "$SHARD" --coverage --testTimeout=300000

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  # Merges the shards' coverage and reports it with octocov (.octocov.yml): a comment on a pull request, the job
  # summary, and on main the report a pull request is compared with. Not a required check, and a failure of any step
  # leaves the run passed: the release workflow and the changes job read whether main's run passed. It runs only for
  # main and for pull requests from this repository, since it holds write permissions and mise reads the checked-out
  # mise.toml.
  coverage:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [changes, coverage-test]
    # After every coverage shard, whether or not its tests passed.
    if: >-
      !cancelled() && needs.changes.outputs.kopje_code == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # for octocov to update its pull request comment
      actions: write # for octocov to read and replace the artifact that keeps main's report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*

      # octocov at the version and checksum mise.lock pins.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: github:k1LoW/octocov

      # Storing main's report in an artifact needs ACTIONS_RUNTIME_TOKEN, which the runner gives an action's process
      # and not a run step, so octocov runs from github-script.
      - name: Report coverage
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            await exec.exec(await io.which('octocov', true))

  # Formatting and lint are checked for every change; Kopje's types and checks only when its suites are affected.
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the release tags: the package check compares the kept stylesheet with the latest
          # release (packages/kopje/scripts/build-assets.mjs), and the migration check reads every release tag.
          fetch-depth: 0
      # node and pnpm at the versions mise.lock pins; the hooks' tools are not needed here.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm

      - name: Install
        run: pnpm install

      - name: Check formatting
        run: pnpm run pretty

      - name: Check linting
        run: pnpm run lint

      # Unused files, dependencies and exports across the workspace and the deploy/ template (knip.jsonc).
      - name: Check unused code
        run: pnpm run knip

      - name: Check kopje types
        if: needs.changes.outputs.kopje == 'true'
        working-directory: packages/kopje
        run: pnpm run typecheck

      # Kopje keeps its Worker under 1.5 MiB gzipped, well inside the Workers size limit. The check packs the npm
      # package, checks the packed files, dry-runs the deploy/ template against the tarball and compares both bundles,
      # runs the template in workerd, and installs the tarball (the CLI and the types). It takes a few seconds.
      - name: Check kopje package and template
        if: needs.changes.outputs.kopje == 'true'
        env:
          KOPJE_ASSETS_REQUIRE_TAGS: "1"
        run: pnpm run check:kopje-package

      # A released migration is never changed: every migration in a kopje-v* tag keeps its bytes
      # (packages/kopje/scripts/released-migrations.mjs). It needs the tags fetched above.
      - name: Check released migrations
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm --filter kopje check:migrations

      # The release steps (publish once, recover a rerun, keep an existing GitHub release), with npm and gh stubbed.
      - name: Test the kopje release scripts
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm run test:scripts

  # Kopje's browser job (packages/kopje/browser/, design §10.11): the fixture pages in Chromium's headless shell, with
  # axe in both colour schemes. Firefox and WebKit are checked by hand before a UI release. The limit holds the worst
  # case: three timed-out downloads (8 min 15 s with the kill grace) after the install and the system dependencies,
  # then the tests (seconds) and the artifact upload.
  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kopje_code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node and pnpm at the versions mise.lock pins; the hooks' tools are not needed here.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright version
        working-directory: packages/kopje
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --exit-status --raw-output 'first | .devDependencies["@playwright/test"].version')
          echo "Playwright version: ${PLAYWRIGHT_VERSION}"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> "$GITHUB_ENV"
          # The runner image names are shell variables, not part of the expression env context.
          echo "RUNNER_IMAGE=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_ENV"

      - name: Cache Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          # Browser builds link against the runner image's libraries, so the image is part of the key.
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_VERSION }}

      # A slow mirror can stall the install: apt gives up on a stalled connection and retries, and the download, only
      # Chromium's headless shell, gets two and a half minutes a try.
      - name: Install Chromium system dependencies
        working-directory: packages/kopje
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          npx playwright install-deps chromium

      - name: Download Chromium
        working-directory: packages/kopje
        run: bash ../../scripts/playwright-install.sh 150 --only-shell chromium

      - name: Run the browser job
        run: pnpm --filter kopje test:browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kopje-browser
          path: |
            packages/kopje/browser/.pages/
            packages/kopje/browser/.results/
          retention-days: 14
          include-hidden-files: true
