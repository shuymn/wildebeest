name: Migration bench
# Times Kopje's release-range upgrade on a GitHub-hosted runner, so the measure never shares a machine with other
# work (scripts/kopje-bench-range.sh). It runs for a pull request that changes the migrations, their registry or the
# bench itself. Changes to the upgrade code (store-kernel.ts) or the toolchain are measured by the dispatch every
# release needs before it merges (packages/kopje/RELEASING.md).
on:
  pull_request:
    paths:
      - "packages/kopje/migrations/**"
      - "packages/kopje/src/db/migrations.ts"
      - "packages/kopje/test/bench/**"
      - "packages/kopje/vitest.bench.config.ts"
      - "scripts/kopje-bench-range.sh"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.ref }}"
  cancel-in-progress: true

jobs:
  bench:
    timeout-minutes: 120
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      # A pull request also measures its base, alternating with the head, so a slow runner shows in both.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # node and pnpm as the head's mise.lock pins them. A base from before the move to mise names pnpm 10 in its
      # package.json packageManager, which pnpm 12 then runs in that checkout, with the base's own .npmrc layout.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          working_directory: head
          install_args: node pnpm

      - name: Install
        run: |
          pnpm --dir head install --frozen-lockfile
          if [ -d base ]; then pnpm --dir base install --frozen-lockfile; fi

      - name: Measure
        run: |
          if [ -d base ]; then
            bash head/scripts/kopje-bench-range.sh "$PWD/head" "$PWD/base"
          else
            bash head/scripts/kopje-bench-range.sh "$PWD/head"
          fi
