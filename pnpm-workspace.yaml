packages:
  - 'packages/kopje'

# Shared pinned versions, named `catalog:` in a package's dependencies.
catalog:
  # The client bundle's builder (packages/kopje/scripts/build-assets.mjs), at the version wrangler resolves; a new
  # version may change the bundle's bytes, which the build then republishes under a new name.
  esbuild: 0.28.2

# Allow dependency build scripts only for reviewed packages.
onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver
  - workerd

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
# semver@6.3.1 is the 6.x backport of the ReDoS fix, published by an npm CLI
# maintainer in July 2023 after 7.5.x had shipped with provenance. The
# publish-date ordering makes it look like a downgrade, and it fails every full
# resolution (including Renovate's lockfile updates).
trustPolicyExclude:
  - semver@6.3.1
