name: Pull request checks
on:
  push:
    branches:
      - main
  pull_request:

# This allows a subsequently queued workflow run to interrupt previous runs. A main run interrupted this way leaves
# nothing unchecked: the next one compares with the last main run that passed (the changes job).
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Decides which suites a change can affect, so a change that is all Kopje Markdown runs only the Node suite. A
  # pull request is compared with its base. A push to main is compared with the commit of the last main run that
  # passed, so what a failed or cancelled run did not check is checked by the next one; when there is no such run,
  # or its commit cannot be fetched, everything runs.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last main run that passed
    outputs:
      kopje: ${{ steps.suites.outputs.kopje }}
      kopje_code: ${{ steps.suites.outputs.kopje_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # A pull request is checked out as a merge commit whose first parent is the base branch. The tree of the last
        # main run that passed was checked in full, through the runs before it, so a main push needs only the paths
        # that differ from it.
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$REPO" --workflow PRs.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          if [[ "$passed" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 origin "$passed"; then
            echo "compared with $passed, the last main run that passed"
            git diff --no-renames --name-only "$passed" HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
          else
            printf 'kopje=true\nkopje_code=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test-api:
    # The slowest shard has taken up to 10.3 minutes on a hosted runner.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Run API tests
        env:
          KOPJE: ${{ needs.changes.outputs.kopje }}
          KOPJE_CODE: ${{ needs.changes.outputs.kopje_code }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash scripts/test-affected.sh --shard "$SHARD"

  # Formatting is checked for every change; Kopje's lint, types and checks only when its suites are affected.
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the release tags: the package check compares the kept stylesheet with the latest
          # release (packages/kopje/scripts/build-assets.mjs).
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Check formatting
        run: pnpm run pretty

      - name: Check kopje linting
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm run lint:kopje

      - name: Check kopje types
        if: needs.changes.outputs.kopje == 'true'
        working-directory: packages/kopje
        run: pnpm run typecheck

      # Kopje keeps its Worker under 1.5 MiB gzipped, well inside the Workers size limit. The check packs the npm
      # package, checks the packed files, dry-runs the deploy/ template against the tarball and compares both bundles,
      # runs the template in workerd, and installs the tarball (the CLI and the types). It takes a few seconds.
      - name: Check kopje package and template
        if: needs.changes.outputs.kopje == 'true'
        env:
          KOPJE_ASSETS_REQUIRE_TAGS: '1'
        run: pnpm run check:kopje-package

      # The release steps (publish once, recover a rerun, keep an existing GitHub release), with npm and gh stubbed.
      - name: Test the kopje release scripts
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm run test:scripts

  # Kopje's browser job (packages/kopje/browser/, design §10.11): the fixture pages in Chromium's headless shell, with
  # axe in both colour schemes. Firefox and WebKit are checked by hand before a UI release. The limit holds the worst
  # case: three timed-out downloads (8 min 15 s with the kill grace) after the install and the system dependencies,
  # then the tests (seconds) and the artifact upload.
  test-browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.kopje_code == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Store Playwright version
        working-directory: packages/kopje
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --exit-status --raw-output 'first | .devDependencies["@playwright/test"].version')
          echo "Playwright version: ${PLAYWRIGHT_VERSION}"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> "$GITHUB_ENV"
          # The runner image names are shell variables, not part of the expression env context.
          echo "RUNNER_IMAGE=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_ENV"

      - name: Cache Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          # Browser builds link against the runner image's libraries, so the image is part of the key.
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ env.RUNNER_IMAGE }}-${{ env.PLAYWRIGHT_VERSION }}

      # A slow mirror can stall the install: apt gives up on a stalled connection and retries, and the download, only
      # Chromium's headless shell, gets two and a half minutes a try.
      - name: Install Chromium system dependencies
        working-directory: packages/kopje
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          npx playwright install-deps chromium

      - name: Download Chromium
        working-directory: packages/kopje
        run: bash ../../scripts/playwright-install.sh 150 --only-shell chromium

      - name: Run the browser job
        run: pnpm --filter kopje test:browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: kopje-browser
          path: |
            packages/kopje/browser/.pages/
            packages/kopje/browser/.results/
          retention-days: 14
          include-hidden-files: true
