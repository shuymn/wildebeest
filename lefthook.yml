# The hooks run the lefthook pinned in package.json, with mise's pinned node and pnpm, whatever lefthook is first on
# PATH; the jobs call the tools mise.toml pins (`mise install`).
lefthook: mise exec -- pnpm exec lefthook

pre-commit:
  skip:
    - merge
    - rebase
  parallel: true
  jobs:
    # Lints the staged files; CI lints the whole tree (pnpm run lint). oxlint skips the files .oxlintrc.json ignores.
    - name: lint
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}"
      run: pnpm exec oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern {staged_files}
    # Formats the staged files and restages them; CI checks the whole tree (pnpm run pretty). oxfmt skips the files
    # it does not format and those .oxfmtrc.json ignores.
    - name: pretty
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Unused files, dependencies and exports (knip.jsonc). knip reads the whole working tree, in about a second; CI
    # runs the same (pnpm run knip).
    - name: knip
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,yaml}"
      run: pnpm exec knip --no-progress
    # Blocks commits that stage secrets; CI scans the whole history (security.yml).
    - name: secrets
      run: mise exec -- betterleaks git --pre-commit --staged --redact --no-banner --verbose
    # The workflow checks CI runs through the shared gha.yml.
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- actionlint {staged_files}
    - name: ghalint
      glob: ".github/workflows/*.{yml,yaml}"
      run: mise exec -- ghalint run

pre-push:
  skip:
    - merge
    - rebase
  jobs:
    # Runs only the suites the branch can affect, and skips a clean tree that already passed them; see
    # scripts/test-affected.sh.
    - name: test
      run: TEST_AFFECTED_SKIP_PASSED=1 bash scripts/test-affected.sh
