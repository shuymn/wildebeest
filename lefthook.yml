pre-commit:
  skip:
    - merge
    - rebase
  parallel: true
  jobs:
    - name: lint
      run: pnpm run lint
    - name: pretty
      run: pnpm run pretty
    # Blocks commits that stage secrets. Install with `mise install` (betterleaks is pinned in mise.toml).
    - name: secrets
      run: betterleaks git --pre-commit --staged --redact --no-banner --verbose

pre-push:
  skip:
    - merge
    - rebase
  jobs:
    # Runs only the suites the branch can affect; see scripts/test-affected.sh.
    - name: test
      run: bash scripts/test-affected.sh
