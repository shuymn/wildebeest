name: Release
# Publishes the kopje npm package and its GitHub release for a tag kopje-v<semver> on a commit of main.
# npm trusted publishing (OIDC) authenticates the publish, so no npm token is stored; npm adds provenance.
# The one-time setup and the release steps are in packages/kopje/RELEASING.md.
on:
  push:
    tags:
      - 'kopje-v*'

permissions: {}

concurrency:
  group: release-kopje
  cancel-in-progress: false

jobs:
  check:
    # Up to 20 minutes waiting for main's checks, and when they did not pass, the whole suite serially (CI splits it
    # in four), which rc.22's run took 32 minutes for.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find main's checks on the tagged commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#kopje-v}
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not kopje-v<semver>"
            exit 1
          fi
          case $version in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          printf 'version=%s\nprerelease=%s\n' "$version" "$prerelease" | tee -a "$GITHUB_OUTPUT"

      # Only reviewed code is released: the tag must point at a commit of main.
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main"
            exit 1
          fi

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' packages/kopje/CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::packages/kopje/CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release-notes.md

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A push to main runs CI (ci.yml), so a tagged commit has usually passed it already. When CI did not pass on it
      # (failed, cancelled, never ran, or still running after 20 minutes), the lint, types and suites run here instead.
      - name: Check main's checks on this commit
        id: main_ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/kopje-main-ci.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"

      - name: Lint
        if: steps.main_ci.outputs.passed != 'true'
        run: pnpm run lint:kopje

      - name: Check types
        if: steps.main_ci.outputs.passed != 'true'
        working-directory: packages/kopje
        run: pnpm run typecheck

      - name: Test
        if: steps.main_ci.outputs.passed != 'true'
        env:
          KOPJE: 'true'
        run: bash scripts/test-affected.sh

      # Builds the bundle with the tag's version (the repository keeps 0.0.0), packs it, checks the package, and
      # dry-runs and runs the deploy/ template against the tarball; that tarball is what is published.
      - name: Pack and check against the template
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KOPJE_ASSETS_REQUIRE_TAGS: '1'
        run: |
          pnpm run check:kopje-package --out "$RUNNER_TEMP/package" --version "$VERSION"
          tarball="kopje-$VERSION.tgz"
          test -f "$RUNNER_TEMP/package/$tarball"
          cp release-notes.md "$RUNNER_TEMP/package/"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kopje-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  publish:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: check
    # The npm trusted publisher names this workflow and this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      # Only the release scripts; the package itself is the checked tarball from the check job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/kopje-publish.mjs
            scripts/kopje-release-lib.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kopje-package
          path: package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later (and Node.js 22.14.0 or later).
      - name: Check the npm version
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version cannot use trusted publishing; it needs 11.5.1 or later"
            exit 1
          fi

      # Publishes the tarball by its absolute path (a bare relative path would be read as a GitHub repository). A
      # version already on npm with this tarball's integrity is not published again, so this job can be rerun after
      # an ambiguous failure; one with another integrity fails.
      - name: Publish
        env:
          TARBALL: ${{ github.workspace }}/package/${{ needs.check.outputs.tarball }}
          DIST_TAG: ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: node scripts/kopje-publish.mjs "$TARBALL" --tag "$DIST_TAG"

  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [check, publish]
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/kopje-github-release.mjs
            scripts/kopje-release-lib.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kopje-package
          path: package

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A rerun after the release was made leaves it as it is (scripts/kopje-release-lib.mjs, createRelease).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          TARBALL: package/${{ needs.check.outputs.tarball }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" --notes package/release-notes.md --tarball "$TARBALL")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          node scripts/kopje-github-release.mjs "${args[@]}"
