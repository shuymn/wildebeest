packages:
  - "packages/kopje"

# Every pinned version of the workspace's packages, each named `catalog:` in a package.json. `pnpm pack` writes the
# versions into the published manifest (scripts/check-kopje-package.mjs). deploy/package.json is outside the workspace
# and pins its own.
catalog:
  # Runtime libraries. The package has no dependencies: its bundles in dist/ carry them.
  age-encryption: 0.3.1
  aws4fetch: 1.0.20
  blurhash: 2.0.5
  entities: 8.1.0
  es-toolkit: 1.53.0
  hono: 4.13.13
  htmlparser2: 12.0.0
  jose: 6.2.12
  linkify-it: 6.1.0
  sanitize-html: 2.18.1
  temporal-polyfill: 1.0.5
  zod: 4.6.7

  # Fedify, one version for all of its packages.
  "@fedify/fedify": 2.4.4
  "@fedify/testing": 2.4.4
  "@fedify/vocab": 2.4.4

  # Cloudflare Workers: the bundler and dev server, the runtime types and the workerd test pool. deploy/package.json
  # pins the same wrangler.
  "@cloudflare/vitest-plugin": 1.4.7
  "@cloudflare/workers-types": 5.20261025.1
  wrangler: 4.149.0

  # Tests: the runner and its vite, property tests, the browser job, image fixtures, the HTML and source scans.
  "@axe-core/playwright": 4.14.0
  "@jsquash/webp": 1.5.0
  "@playwright/test": 1.64.0
  fast-check: 4.10.2
  oxc-parser: 0.154.0
  parse5: 8.0.1
  vite: 6.4.4
  vitest: 5.0.5

  # Lint, format and the Git hooks.
  lefthook: 2.2.1
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2005

  # TypeScript and type packages.
  "@types/node": 24.19.2
  "@types/sanitize-html": 2.16.2
  typescript: 7.0.2

  # The client bundle's builder (packages/kopje/scripts/build-assets.mjs), at the version wrangler resolves; a new
  # version may change the bundle's bytes, which the build then republishes under a new name.
  esbuild: 0.28.2

# Dependency build scripts, each reviewed: none runs, since every one of these packages takes its platform binary from
# optionalDependencies.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false

# Fail installs when an unreviewed dependency build script appears.
strictDepBuilds: true

# Reject package versions published within the last 3 days.
minimumReleaseAge: 4320

# Block git/tarball URL sources in transitive dependencies.
blockExoticSubdeps: true

# Detect package trust/provenance downgrades.
trustPolicy: no-downgrade
