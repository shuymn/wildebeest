name: Backup
on:
  schedule:
    # A D1 export makes the database unresponsive for roughly 1s per 10MB of data,
    # so this runs at a low-traffic hour. See docs/legacy-backup.md.
    - cron: "30 18 * * *"
  workflow_dispatch:

# Deploy migrates the D1 database, and a backup export blocks it, so the two
# never run at the same time. GitHub keeps one pending run per group, so a
# newer run replaces a pending one rather than queueing behind it.
concurrency:
  group: legacy-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NO_D1_WARNING: true
    steps:
      - name: Check backup configuration
        id: config
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ] || [ -z "$BACKUP_S3_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]
          then
              echo "::notice::Backups are not configured for this instance; skipping. See docs/legacy-backup.md."
              echo "configured=false" >> "$GITHUB_OUTPUT"
          else
              echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}

      - name: Set name suffix
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: |
          if [ -z "$OVERRIDE_NAME_SUFFIX" ]
          then
              echo "$GH_OWNER" | awk '{ print "NAME_SUFFIX=" tolower($0) }' >> "$GITHUB_ENV"
          else
              echo "$OVERRIDE_NAME_SUFFIX" | awk '{ print "NAME_SUFFIX=" tolower($0) }' >> "$GITHUB_ENV"
          fi
        env:
          GH_OWNER: ${{ github.repository_owner }}
          OVERRIDE_NAME_SUFFIX: ${{ vars.OVERRIDE_NAME_SUFFIX }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.config.outputs.configured == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install packages
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install age
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Run backup
        if: ${{ steps.config.outputs.configured == 'true' }}
        run: ./scripts/backup/backup.sh
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
