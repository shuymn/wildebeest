name: Pull request checks
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/**"
      - "!.github/workflows/PRs.yml"
      - "*.md"
      - "docs/**"
      # Kopje's tests read the OAuth scope table of the Mastodon API docs.
      - "!docs/mastodon-api-spec/client-api/auth-oauth.md"
      - "renovate.json"
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
      - "!.github/workflows/PRs.yml"
      - "*.md"
      - "docs/**"
      # Kopje's tests read the OAuth scope table of the Mastodon API docs.
      - "!docs/mastodon-api-spec/client-api/auth-oauth.md"
      - "renovate.json"

# This allows a subsequently queued workflow run to interrupt previous runs. A main run interrupted this way leaves
# nothing unchecked: the next one compares with the last main run that passed (the changes job).
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

env:
  SQLDEF_VERSION: v3.11.26
  OCTOCOV_VERSION: v0.83.3

jobs:
  # Decides which suites a change can affect, so a kopje-only change skips the legacy suites and the reverse. A
  # pull request is compared with its base. A push to main is compared with the commit of the last main run that
  # passed, so what a failed or cancelled run did not check is checked by the next one; when there is no such run,
  # or its commit cannot be fetched, everything runs.
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to find the last main run that passed
    outputs:
      kopje: ${{ steps.suites.outputs.kopje }}
      kopje_code: ${{ steps.suites.outputs.kopje_code }}
      legacy: ${{ steps.suites.outputs.legacy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # A pull request is checked out as a merge commit whose first parent is the base branch. The tree of the last
        # main run that passed was checked in full, through the runs before it, so a main push needs only the paths
        # that differ from it.
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$REPO" --workflow PRs.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          if [[ "$passed" =~ ^[0-9a-f]{40}$ ]] && git fetch --quiet --no-tags --depth=1 origin "$passed"; then
            echo "compared with $passed, the last main run that passed"
            git diff --no-renames --name-only "$passed" HEAD | bash scripts/test-affected.sh suites | tee -a "$GITHUB_OUTPUT"
          else
            printf 'kopje=true\nkopje_code=true\nlegacy=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test-api:
    # The slowest shard has taken up to 10.3 minutes on a hosted runner.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        if: needs.changes.outputs.legacy == 'true'
        run: pnpm run build

      # Coverage covers only the legacy packages.
      - name: Run API tests
        env:
          KOPJE: ${{ needs.changes.outputs.kopje }}
          KOPJE_CODE: ${{ needs.changes.outputs.kopje_code }}
          LEGACY: ${{ needs.changes.outputs.legacy }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        shell: bash
        run: |
          args=(--shard "$SHARD")
          if [ "$LEGACY" = true ]; then
            args+=(--coverage)
          fi
          bash scripts/test-affected.sh "${args[@]}"

      - name: Upload coverage
        if: needs.changes.outputs.legacy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: octocov-${{ matrix.shard }}
          path: coverage/lcov.info
          if-no-files-found: error

  coverage:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [changes, test-api]
    if: needs.changes.outputs.legacy == 'true'
    permissions:
      contents: read
      pull-requests: write # for octocov to update PR comments
      actions: write # for octocov to replace artifact-backed reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: octocov-*

      - name: Normalize coverage reports
        run: |
          for shard in 1 2 3 4; do
            report="octocov-${shard}/lcov.info"
            if [ -f "${report}" ]; then
              continue
            fi
            cp "octocov-${shard}/coverage/lcov.info" "${report}"
          done

      - uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1
        with:
          version: ${{ env.OCTOCOV_VERSION }}

  # Formatting is checked for every change; each package's lint, types and checks only when its suite is affected.
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and the release tags: the package check compares the kept stylesheet with the latest
          # release (packages/kopje/scripts/build-assets.mjs).
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Check formatting
        run: pnpm run pretty

      - name: Check backend linting
        if: needs.changes.outputs.legacy == 'true'
        run: pnpm run lint:backend

      - name: Check consumer linting
        if: needs.changes.outputs.legacy == 'true'
        run: pnpm run lint:consumer

      - name: Check do linting
        if: needs.changes.outputs.legacy == 'true'
        run: pnpm run lint:do

      - name: Check frontend linting
        if: needs.changes.outputs.legacy == 'true'
        run: pnpm run lint:frontend

      - name: Check frontend types
        if: needs.changes.outputs.legacy == 'true'
        continue-on-error: true
        working-directory: packages/frontend
        run: pnpm run types-check

      - name: Check kopje linting
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm run lint:kopje

      - name: Check kopje types
        if: needs.changes.outputs.kopje == 'true'
        working-directory: packages/kopje
        run: pnpm run typecheck

      # Kopje keeps its Worker under 1.5 MiB gzipped, well inside the Workers size limit. The check packs the npm
      # package, checks the packed files, dry-runs the deploy/ template against the tarball and compares both bundles,
      # runs the template in workerd, and installs the tarball (the CLI and the types). It takes a few seconds.
      - name: Check kopje package and template
        if: needs.changes.outputs.kopje == 'true'
        env:
          KOPJE_ASSETS_REQUIRE_TAGS: '1'
        run: pnpm run check:kopje-package

      # The release steps (publish once, recover a rerun, keep an existing GitHub release), with npm and gh stubbed.
      - name: Test the kopje release scripts
        if: needs.changes.outputs.kopje == 'true'
        run: pnpm run test:scripts

      - name: Install sqlite3def
        if: needs.changes.outputs.legacy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo sqldef/sqldef --pattern "sqlite3def_linux_amd64.tar.gz" "${{ env.SQLDEF_VERSION }}" --output - | tar -xzf -
          mv sqlite3def /usr/local/bin/sqlite3def
          chmod +x /usr/local/bin/sqlite3def
          sqlite3def --version

      - name: Check DB schema
        if: needs.changes.outputs.legacy == 'true'
        run: bash scripts/check-schema.sh

  # A skipped job reports success, so the required check still passes for a kopje-only change.
  test-ui:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.legacy == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run App in the background
        run: |
          nohup pnpm run ci-dev-test-ui >"${RUNNER_TEMP}/ci-dev-test-ui.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/ci-dev-test-ui.pid"

      - name: Store Playwright version
        working-directory: packages/frontend
        run: |
          PLAYWRIGHT_VERSION=$(pnpm ls @playwright/test --json | jq --exit-status --raw-output 'first | .devDependencies["@playwright/test"].version')
          echo "Playwright version: ${PLAYWRIGHT_VERSION}"
          echo "PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Playwright
        id: cache-playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          # Browser builds link against the runner image's libraries, so the image is part of the key.
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Download Playwright browsers
        working-directory: packages/frontend
        run: npx playwright install --with-deps

      - name: Wait for app readiness
        run: |
          APP_LOG="${RUNNER_TEMP}/ci-dev-test-ui.log"

          check_ready() {
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 http://127.0.0.1:8788/explore >/dev/null
          }

          for _ in {1..180}; do
            if check_ready; then
              exit 0
            fi
            sleep 2
          done

          echo "::group::ci-dev-test-ui log"
          tail -n 200 "${APP_LOG}" || true
          echo "::endgroup::"
          check_ready

      - name: Run Playwright tests
        run: pnpm run test:ui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 30
