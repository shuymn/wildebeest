# The repository settings, applied with gh-infra (pinned in mise.toml): gh-infra plan .github/infra.yaml
apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: kopje
  owner: shuymn
spec:
  description: A Mastodon-compatible ActivityPub server for one person or a small group, on one Cloudflare Worker
  visibility: public
  archived: false
  labels:
  - name: dependencies
    color: CDA5F3
  - name: 🌱 Good First Issue
    color: 3BBC76
  - name: 🐛 Bug
    color: d73a4a
  - name: 💡 Feature
    color: 34BDC0
  - name: 💭 Idea
    color: DDD535
  - name: 📚 Documentation
    color: bfd4f2
  - name: 🔍 Investigation
    color: 1EF4C3
  - name: 🤝 Help Wanted
    color: AC7E49
  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true
  merge_strategy:
    allow_merge_commit: true
    allow_squash_merge: false
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: COMMIT_OR_PR_TITLE
    squash_merge_commit_message: COMMIT_MESSAGES
    merge_commit_title: MERGE_MESSAGE
    merge_commit_message: PR_TITLE
  release_immutability: false
  security:
    vulnerability_alerts: true
    automated_security_fixes: false
    private_vulnerability_reporting: true
  branch_protection:
  - pattern: main
    required_reviews: 0
    dismiss_stale_reviews: false
    require_code_owner_reviews: false
    require_status_checks:
      strict: false
      contexts:
      - lint
      - test-api (1)
      - test-api (2)
      - test-api (3)
      - test-api (4)
      - test-browser
    enforce_admins: false
    restrict_pushes: false
    allow_force_pushes: false
    allow_deletions: false
  rulesets:
  - name: kopje release tags
    target: tag
    enforcement: active
    bypass_actors:
    - role: admin
      bypass_mode: always
    conditions:
      ref_name:
        include:
        - refs/tags/kopje-v*
    rules:
      non_fast_forward: false
      update: true
      deletion: true
      creation: true
      required_linear_history: false
      required_signatures: false
  actions:
    enabled: true
    allowed_actions: selected
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    selected_actions:
      github_owned_allowed: true
      verified_allowed: true
      patterns_allowed:
      - pnpm/action-setup@*
    fork_pr_approval: first_time_contributors
